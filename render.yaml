# Render Blueprint — New → Blueprint → pick this repo → Apply.
# Secrets marked `sync: false` are typed into the Render dashboard, never committed.
services:
  - type: web
    name: nexus-os
    runtime: node
    plan: free
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Supabase → Project Settings → API (run supabase-schema.sql first)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Any OpenAI-compatible endpoint. Free option: Groq
      #   EMERGENT_LLM_BASE_URL = https://api.groq.com/openai/v1
      #   LLM_MODEL             = openai/gpt-oss-120b
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: EMERGENT_LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # Password gate for the whole app. Set both: the API uses the
      # service-role key, so without them anyone could read or delete memories.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
